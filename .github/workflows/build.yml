name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and its tags: the version comes from the latest v* tag (MinVer).
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          # net8.0 for the projects; 9.0 to read Telaelus.slnx.
          dotnet-version: |
            8.0.x
            9.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: .ci-cache
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/godot-version.txt', 'ci/export.py') }}
      - name: Export script self-test
        run: python ci/export.py selftest
      # Before anything is built or restored, as in the export job.
      - name: Version
        run: python ci/export.py version
      - name: Set up Godot
        run: python ci/export.py setup
      - name: Build
        run: dotnet build Telaelus.slnx -c Debug
      - name: Import the project
        run: python ci/export.py import
      - name: Sim tests
        run: dotnet test src/Telaelus.Sim.Tests --no-build
      - name: Integration tests
        run: dotnet test src/Telaelus.Integration.Tests --no-build

  export:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # To create the tag's GitHub Release and attach the zips (the last step).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history and its tags: the version comes from the latest v* tag (MinVer).
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: .ci-cache
          key: godot-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/godot-version.txt', 'ci/export.py') }}
      - name: Set up Godot
        run: python ci/export.py setup
      - name: Export Windows and macOS builds
        run: python ci/export.py export --platform all
      # Each build's zip is uploaded as is (archive: false takes one file and names the artifact
      # after it), so a download is our zip, not one GitHub wraps around it. The macOS zip must
      # stay ours: a zip GitHub makes drops the app's executable flag. act's artifact server cannot
      # take v7 uploads yet (nektos/act#6022), so act skips them (it sets ACT).
      - uses: actions/upload-artifact@v7
        if: ${{ !env.ACT }}
        with:
          path: dist/*-windows-x64.zip
          archive: false
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ !env.ACT }}
        with:
          path: dist/*-windows-arm64.zip
          archive: false
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ !env.ACT }}
        with:
          path: dist/*-macos.zip
          archive: false
          retention-days: 14
      # A tag push publishes its GitHub Release with the three zips (gh, preinstalled on the runner).
      - name: Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/export.py release
